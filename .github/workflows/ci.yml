name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest tests/ -q

  numpy-only:
    # The core must work with numpy alone; scipy and laspy are accelerators.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pytest
      - run: python -m pytest tests/ -q

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Bake sample scans
        run: python tools/make_sample_data.py --out data/samples
      - name: Compile a world
        run: |
          lidarworld compile data/samples/townblock.las -o build/town -n townblock \
            --theme survey --theme victorian --theme neon --gltf --cityjson
      - name: Forward-validate the street sweep
        run: |
          lidarworld compile data/samples/street.bin -o build/street -n street --theme survey -q
          lidarworld validate build/street/street.lwir --scan data/samples/street.bin
      - name: Check the bundle is complete
        run: |
          test -s build/town/world.bin
          test -s build/town/world.json
          test -s build/town/townblock.lwir
          test -s build/town/townblock.city.json
          test -s build/town/gltf/townblock.gltf
          for t in survey victorian neon; do test -s "build/town/themes/$t/theme.json"; done
