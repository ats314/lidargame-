name: Deploy viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Bake sample scans
        run: python tools/make_sample_data.py --out data/samples
      - name: Compile the demo world into the viewer
        run: |
          lidarworld compile data/samples/townblock.las -o viewer/world -n townblock \
            --theme survey --theme victorian --theme neon
          rm -f viewer/world/*.lwir
      # enablement lets the workflow turn Pages on itself. If the repository
      # has never had Pages configured, this is what avoids a manual visit to
      # Settings -> Pages -> Source -> GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
