name: Deploy viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,laz]"
      - name: Fetch a public-domain USGS 3DEP tile (Denver LoDo)
        run: |
          rm -rf data/real
          lidarworld fetch denver_lodo -o data/real
          ls -la data/real
      - name: Compile a block of it into the viewer
        run: |
          TILE=$(ls data/real/*.laz | head -1)
          lidarworld compile "$TILE" -o viewer/world -n denver_lodo \
            --crop 350 --tile 0.4 --footprints denver \
            --theme survey --theme victorian --theme neon --sir
          rm -f viewer/world/*.lwir
          du -sh viewer/world
      # enablement lets the workflow turn Pages on itself. If the repository
      # has never had Pages configured, this is what avoids a manual visit to
      # Settings -> Pages -> Source -> GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # .nojekyll keeps the legacy Jekyll builder away from the artifact --
      # without it, files and directories beginning with an underscore are
      # silently dropped from the published site.
      - run: touch viewer/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
